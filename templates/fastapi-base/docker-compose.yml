version: '3.8'

services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-my-assistant}
      - DOMAIN=${DOMAIN:-localhost}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
    env_file:
      - .env
    restart: unless-stopped
